    <style>
      :where(.dk-erp-root), :where(.dk-erp-root) *, :where(.dk-erp-root) *::before, :where(.dk-erp-root) *::after {
        box-sizing: border-box;
        border-width: 0;
        border-style: solid;
        border-color: rgba(255, 255, 255, 0.1);
      }
      :where(.dk-erp-root) {
        background-color: #121212;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      :where(.dk-erp-root) h1, :where(.dk-erp-root) h2, :where(.dk-erp-root) h3, :where(.dk-erp-root) h4, :where(.dk-erp-root) h5, :where(.dk-erp-root) h6, :where(.dk-erp-root) p {
        margin: 0;
      }
      :where(.dk-erp-root) a {
        color: inherit;
        text-decoration: none;
      }
      :where(.dk-erp-root) button, :where(.dk-erp-root) input, :where(.dk-erp-root) select, :where(.dk-erp-root) textarea {
        font-family: inherit;
        color: inherit;
        margin: 0;
        background-color: transparent;
      }
      :where(.dk-erp-root) select option {
        background-color: #18181b;
        color: #ffffff;
      }
      :where(.dk-erp-root) button {
        cursor: pointer;
      }
      :where(.dk-erp-root) table {
        border-collapse: collapse;
      }
      /* Glassmorphism card treatment matching SignIn1 */
      .dk-erp-root .bg-surface-container-low {
        background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, rgba(18, 18, 18, 0.85) 100%);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.09);
      }
      .dk-erp-root .bg-surface-container {
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .dk-erp-root .bg-primary-container {
        background-image: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.1) 100%);
        border: 1px solid rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(8px);
      }
      .dk-erp-root ::-webkit-scrollbar {
        display: none;
      }
      .dk-erp-root .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
        user-select: none;
